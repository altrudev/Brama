[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brama-assurance-boundary"
version = "0.2.0"
description = "Clean-side governed evidence, authority and outcome assurance for BRAMA"
requires-python = ">=3.11"
authors = [{name = "Valentyn Rukhaylo"}]

[project.scripts]
brama-monitor = "brama_assurance.cli:main"
brama-audit = "brama_assurance.audit:main"
brama-proof = "brama_assurance.proof_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
